<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JurisMatrix // EAR HUD</title>
    <!-- Tailwind CSS CDN for instant, beautiful styling -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col">

    <!-- Top HUD Bar -->
    <header class="bg-slate-900 border-b border-slate-800 px-6 py-4 flex justify-between items-center shadow-md">
        <div class="flex items-center space-x-3">
            <span class="inline-block w-3 h-3 bg-emerald-500 rounded-full animate-pulse"></span>
            <h1 class="text-lg font-bold tracking-wide text-white">JURISHMATRIX // EAR HUD</h1>
        </div>
        <div class="text-xs text-slate-400 bg-slate-800 px-3 py-1.5 rounded border border-slate-700">
            Source: 15 CFR Part 738, Supp. No. 1
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-6 grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <!-- Left Panel: Search & Controls -->
        <section class="bg-slate-900 border border-slate-800 rounded-xl p-5 flex flex-col space-y-4 shadow-lg lg:col-span-1">
            <h2 class="text-sm font-semibold tracking-wider text-slate-400 uppercase">Destination Query</h2>
            
            <div>
                <label for="countrySearch" class="block text-xs font-medium text-slate-400 mb-1">Search Destination Country</label>
                <input type="text" id="countrySearch" placeholder="e.g. Afghanistan, Albania..." 
                    class="w-full bg-slate-950 border border-slate-700 rounded-lg px-4 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-emerald-500 transition-colors">
            </div>

            <div>
                <label for="reasonFilter" class="block text-xs font-medium text-slate-400 mb-1">Filter Reason for Control</label>
                <select id="reasonFilter" 
                    class="w-full bg-slate-950 border border-slate-700 rounded-lg px-4 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-emerald-500 transition-colors">
                    <option value="ALL">All Control Triggers</option>
                    <option value="NS1">National Security (NS Column 1)</option>
                    <option value="NS2">National Security (NS Column 2)</option>
                    <option value="AT1">Anti-Terrorism (AT Column 1)</option>
                    <option value="NP1">Nuclear Non-Proliferation (NP Column 1)</option>
                </select>
            </div>

            <div class="pt-4 border-t border-slate-800 text-xs text-slate-500 space-y-1">
                <p><strong class="text-slate-400">Tip:</strong> Results update dynamically on keystroke.</p>
                <p><strong class="text-slate-400">Shortcut:</strong> Click any row to copy citation.</p>
            </div>
        </section>

        <!-- Right Panel: Results Matrix / HUD Display -->
        <section class="bg-slate-900 border border-slate-800 rounded-xl p-5 flex flex-col shadow-lg lg:col-span-2">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-sm font-semibold tracking-wider text-slate-400 uppercase">Compliance Matrix</h2>
                <span id="resultCount" class="text-xs bg-slate-800 text-emerald-400 px-2.5 py-1 rounded-full font-mono">0 records</span>
            </div>

            <div class="overflow-x-auto flex-1 border border-slate-800 rounded-lg bg-slate-950">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-slate-800 text-xs text-slate-400 bg-slate-900/50">
                            <th class="p-3">Destination Country</th>
                            <th class="p-3">NS Column 1</th>
                            <th class="p-3">NS Column 2</th>
                            <th class="p-3">AT Column 1</th>
                            <th class="p-3">NP Column 1</th>
                            <th class="p-3">Footnotes</th>
                        </tr>
                    </thead>
                    <tbody id="matrixTableBody" class="text-sm divide-y divide-slate-900">
                        <!-- Loaded dynamically via fetch -->
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <!-- JavaScript Execution Engine -->
    <script>
        let masterDataset = [];

        const searchInput = document.getElementById('countrySearch');
        const reasonFilter = document.getElementById('reasonFilter');
        const tableBody = document.getElementById('matrixTableBody');
        const resultCount = document.getElementById('resultCount');

        async function loadMatrixData() {
            try {
                const response = await fetch('country-chart.json');
                if (!response.ok) throw new Error('Failed to load dataset');
                masterDataset = await response.json();
                renderTable(masterDataset);
            } catch (error) {
                tableBody.innerHTML = `<tr><td colspan="6" class="p-6 text-center text-rose-500">Error loading country-chart.json. Ensure you are running via a local web server.</td></tr>`;
            }
        }

        function renderTable(data) {
            tableBody.innerHTML = '';
            resultCount.textContent = `${data.length} records`;

            if (data.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="6" class="p-6 text-center text-slate-500 italic">No matching destination records found.</td></tr>`;
                return;
            }

            data.forEach(item => {
                const row = document.createElement('tr');
                row.className = "hover:bg-slate-900/80 transition-colors cursor-pointer";
                row.innerHTML = `
                    <td class="p-3 font-medium text-slate-200">${item.country}</td>
                    <td class="p-3">${renderCell(item.ns1)}</td>
                    <td class="p-3">${renderCell(item.ns2)}</td>
                    <td class="p-3">${renderCell(item.at1)}</td>
                    <td class="p-3">${renderCell(item.np1)}</td>
                    <td class="p-3 text-xs text-slate-400 font-mono">${item.footnotes}</td>
                `;
                
                row.addEventListener('click', () => {
                    navigator.clipboard.writeText(`Country: ${item.country} | NS1: ${item.ns1} | NS2: ${item.ns2}`);
                    row.classList.add('bg-emerald-950/40');
                    setTimeout(() => row.classList.remove('bg-emerald-950/40'), 400);
                });

                tableBody.appendChild(row);
            });
        }

        function renderCell(val) {
            if (val) {
                return `<span class="inline-block w-2.5 h-2.5 bg-rose-500 rounded-full mr-1.5 align-middle"></span><span class="text-rose-400 font-semibold text-xs">X</span>`;
            }
            return `<span class="text-slate-600 text-xs">-</span>`;
        }

        function filterData() {
            const query = searchInput.value.toLowerCase();
            const filter = reasonFilter.value;

            const filtered = masterDataset.filter(item => {
                const matchesSearch = item.country.toLowerCase().includes(query);
                
                let matchesReason = true;
                if (filter === 'NS1') matchesReason = item.ns1;
                if (filter === 'NS2') matchesReason = item.ns2;
                if (filter === 'AT1') matchesReason = item.at1;
                if (filter === 'NP1') matchesReason = item.np1;

                return matchesSearch && matchesReason;
            });

            renderTable(filtered);
        }

        // Event Listeners
        searchInput.addEventListener('input', filterData);
        reasonFilter.addEventListener('change', filterData);

        // Initialize App
        loadMatrixData();
    </script>
</body>
</html>
