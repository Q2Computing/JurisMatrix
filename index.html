        function initializeEngine() {
            // Compile the full master dataset natively into memory immediately
            compiledMatrix = masterDataset.map(item => ({
                country: item.country || "UNKNOWN JURISDICTION",
                ns1: item.ns1 !== undefined ? Boolean(item.ns1) : true,
                ns2: item.ns2 !== undefined ? Boolean(item.ns2) : true,
                at1: item.at1 !== undefined ? Boolean(item.at1) : true,
                np1: item.np1 !== undefined ? Boolean(item.np1) : true,
                footnotes: item.footnotes || "FAIL-SAFE DEFAULT APPLIED"
            }));

            statusIndicator.className = "inline-block w-3 h-3 bg-emerald-500 rounded-full";
            versionBadge.textContent = "Client Engine Active: Full Roster Compiled";
            
            renderTable(compiledMatrix);
        }

        function renderTable(data) {
            tableBody.innerHTML = '';
            resultCount.textContent = `${data.length} records compiled`;

            if (data.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="6" class="p-6 text-center text-slate-500 italic">No matching destination records found.</td></tr>`;
                return;
            }

            data.forEach(item => {
                const row = document.createElement('tr');
                row.className = "hover:bg-slate-900/85 transition-colors cursor-pointer font-mono text-xs";
                
                row.innerHTML = `
                    <td class="p-3 font-sans font-medium text-slate-200">${item.country}</td>
                    <td class="p-3">${renderCell(item.ns1)}</td>
                    <td class="p-3">${renderCell(item.ns2)}</td>
                    <td class="p-3">${renderCell(item.at1)}</td>
                    <td class="p-3">${renderCell(item.np1)}</td>
                    <td class="p-3 text-slate-400">${item.footnotes}</td>
                `;
                
                row.addEventListener('click', () => {
                    navigator.clipboard.writeText(JSON.stringify(item));
                    row.classList.add('bg-emerald-950/50');
                    setTimeout(() => row.classList.remove('bg-emerald-950/50'), 400);
                });

                tableBody.appendChild(row);
            });
        }

        function renderCell(val) {
            if (val) {
                return `<span class="inline-block w-2 h-2 bg-rose-500 rounded-full mr-1"></span><span class="text-rose-400 font-bold">TRUE (RESTRICTED)</span>`;
            }
            return `<span class="text-slate-600">-</span>`;
        }

        function filterData() {
            const query = searchInput.value.toLowerCase();
            const filter = reasonFilter.value;

            const filtered = compiledMatrix.filter(item => {
                const matchesSearch = item.country.toLowerCase().includes(query);
                let matchesReason = true;
                
                if (filter !== 'ALL') {
                    matchesReason = item[filter] === true;
                }

                return matchesSearch && matchesReason;
            });

            renderTable(filtered);
        }

        searchInput.addEventListener('input', filterData);
        reasonFilter.addEventListener('change', filterData);

        // Execute compilation on load
        initializeEngine();
